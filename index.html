<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그랑빌 25평 3D 하우스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: full-bleed 3D stage, floating control rail on the right (bottom sheet on phones), info card bottom-left */
:root{
  --bg:#EEEAE4; --panel:rgba(255,253,250,.9); --fg:#2A251F; --muted:#6F665B; --line:#E2D9CD;
  --accent:#8A5C38; --accent-ink:#FFFFFF; --chip:#F3EEE7;
  --pink:#D93FB5; --cyan:#12A5D6; --orange:#F28C28;
  --display:"Nanum Myeongjo","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1916; --panel:rgba(33,30,27,.9); --fg:#EEE8DF; --muted:#A99F92; --line:#3B352E;
  --accent:#D29A68; --accent-ink:#1B1916; --chip:#2B2722; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1B1916; --panel:rgba(33,30,27,.9); --fg:#EEE8DF; --muted:#A99F92; --line:#3B352E;
  --accent:#D29A68; --accent-ink:#1B1916; --chip:#2B2722; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;width:100%}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;line-height:1;
  padding:3px 6px;border-radius:4px;background:rgba(255,255,255,.82);color:#2A251F;font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lb.room{font-size:13px;font-weight:600;background:rgba(42,37,31,.78);color:#fff;padding:4px 8px}
.lb.dim{background:rgba(255,255,255,.6);color:#6F665B;font-weight:400}
.head{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-width:360px;
  backdrop-filter:blur(8px)}
.head h1{font-family:var(--display);font-size:20px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.head p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.rail{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));
  bottom:calc(14px + env(safe-area-inset-bottom,0px));width:280px;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(8px)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.sw:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sws{display:flex;flex-direction:column;gap:6px}
.sw{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12.5px;text-align:left}
.sw i{width:34px;height:20px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.1);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 8px)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%}
input[type=range]{width:100%;accent-color:var(--accent)}
.rv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.refs{font-size:11.5px;color:var(--muted);line-height:1.55}
.refs a{color:var(--accent)}
.info{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:220px;max-width:320px;backdrop-filter:blur(8px)}
.info b{display:block;font-size:14px;margin-bottom:4px}
.info div{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5}
.info .x{position:absolute;right:8px;top:6px;border:0;background:none;cursor:pointer;font-size:16px;color:var(--muted)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;pointer-events:none}
.toggle-rail{display:none}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .head{right:max(16px,env(safe-area-inset-right,0px));max-width:none;padding:10px 12px}
  .head h1{font-size:17px}
  .head p{font-size:11.5px}
  .rail{top:auto;left:max(16px,env(safe-area-inset-left,0px));width:auto;max-height:46%;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .rail.closed .sec:not(.keep){display:none}
  .toggle-rail{display:block}
  .views{grid-template-columns:repeat(3,1fr)}
  .info{bottom:auto;top:calc(96px + env(safe-area-inset-top,0px))}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <canvas id="stage" aria-label="그랑빌 25평 3D 모델"></canvas>
  <div id="labels"></div>
  <header class="head">
    <h1>그랑빌 25평 3D 하우스</h1>
    <p id="modeHint">드래그로 돌려보고, 휠이나 두 손가락으로 확대하세요. 오른쪽에서 방을 고르면 그 방 안에서 둘러볼 수 있어요.</p>
  </header>
  <aside class="rail closed" id="rail">
    <section class="sec keep">
      <h2>보기</h2>
      <div class="views" id="views"></div>
      <button class="btn toggle-rail" id="moreBtn" aria-expanded="false">옵션 더 보기</button>
    </section>
    <section class="sec">
      <h2>시간</h2>
      <div class="seg">
        <button class="btn" id="dayBtn" aria-pressed="true">낮 (햇빛)</button>
        <button class="btn" id="nightBtn" aria-pressed="false">밤 (다운라이트)</button>
      </div>
    </section>
    <section class="sec">
      <h2>마루 색</h2>
      <div class="sws" id="floors"></div>
    </section>
    <section class="sec">
      <h2>표시</h2>
      <label class="chk"><input type="checkbox" id="lblChk" checked> 이름표</label>
      <label class="chk"><input type="checkbox" id="mepChk"> 조명 · 콘센트 · 인터넷 위치</label>
      <div class="legend"><span><i class="dot" style="background:var(--pink)"></i>2인치 다운라이트</span><span><i class="dot" style="background:var(--cyan)"></i>콘센트</span><span><i class="dot" style="background:var(--orange);border-radius:2px"></i>인터넷 단자</span></div>
    </section>
    <section class="sec">
      <h2>벽 높이 (위에서 볼 때)</h2>
      <input type="range" id="cut" min="0.9" max="2.3" step="0.05" value="2.3" aria-label="벽 높이">
      <div class="rv"><span>0.9 m</span><span id="cutV">2.30 m</span><span>2.3 m</span></div>
    </section>
    <section class="sec">
      <h2>기준</h2>
      <div class="refs">평면도 · PPT 배치 · 자재 메모 기준 모델이에요. 치수는 도면 기준 추정값이에요.<br>
        스타일 참고: <a href="https://ggid.co.kr/case-221356353365/" target="_blank" rel="noopener">월계 그랑빌 시공 사례</a>,
        <a href="https://soomgo.com/portfolio/detail/6a83af0f5df69480e2a7493e" target="_blank" rel="noopener">노원 25평 화이트·우드 사례</a></div>
    </section>
  </aside>
  <div class="info" id="info" hidden><button class="x" id="infoX" aria-label="닫기">×</button><b id="infoT"></b><div id="infoD"></div></div>
  <div class="hint" id="hint">가구를 누르면 이름과 크기가 나와요</div>
</div>

function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
  return t;
}
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=> (s=s*16807%2147483647)/2147483647;}
function shadeHex(hex,k){const c=new THREE.Color(hex);c.multiplyScalar(k);return '#'+c.getHexString();}
const PLANK_TILE = 1.32; // 165mm 폭 × 8장
function woodTex(base){
  return canvasTex(1024,1024,(g,w,h)=>{
    const r=rnd(7), pw=w/8, col=new THREE.Color(base);
    for(let i=0;i<8;i++){
      const joints=[r()*h];
      for(let s=0;s<2;s++){
        const k=0.93+r()*0.12, c=col.clone().multiplyScalar(k);
        g.fillStyle='#'+c.getHexString();g.fillRect(i*pw,0,pw,h);
      }
      // 결
      for(let l=0;l<38;l++){
        const x0=i*pw+r()*pw, a=0.04+r()*0.07;
        g.strokeStyle=`rgba(90,55,25,${a})`;g.lineWidth=0.6+r()*1.4;g.beginPath();
        for(let y=0;y<=h;y+=16){const x=x0+Math.sin(y*0.012+l)*3+Math.sin(y*0.05+i)*1.2;y?g.lineTo(x,y):g.moveTo(x,y);}
        g.stroke();
      }
      // 옹이 느낌
      if(r()>0.5){g.fillStyle='rgba(110,70,35,.12)';g.beginPath();g.ellipse(i*pw+pw*r(),h*r(),5,12,0,0,7);g.fill();}
      g.fillStyle='rgba(70,45,25,.35)';g.fillRect(i*pw,0,1.5,h);               // 세로 이음
      joints.forEach(j=>{g.fillRect(i*pw,j,pw,1.5);});                          // 끝 이음
    }
  },true);
}
const plasterTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#F4F2ED';g.fillRect(0,0,w,h);const r=rnd(3);
  for(let i=0;i<2600;i++){const a=r()*0.05;g.fillStyle=r()>.5?`rgba(0,0,0,${a*0.5})`:`rgba(255,255,255,${a})`;
    g.beginPath();g.arc(r()*w,r()*h,1+r()*7,0,7);g.fill();}
},true);
plasterTex.repeat.set(2,2);
const tileTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#CFC8BC';g.fillRect(0,0,w,h);const r=rnd(11);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=`rgba(255,255,255,${0.05+r()*0.08})`;g.fillRect(i*128+2,j*128+2,124,124);}
  g.strokeStyle='rgba(90,85,78,.6)';g.lineWidth=3;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*128,0);g.lineTo(i*128,h);g.stroke();g.beginPath();g.moveTo(0,i*128);g.lineTo(w,i*128);g.stroke();}
},true);

const texCache={};
function frontTex(mode,wm,hm,base){
  const key=[mode,wm.toFixed(2),hm.toFixed(2),base].join('|');
  if(texCache[key])return texCache[key];
  const W=256,Hh=Math.max(64,Math.round(256*hm/Math.max(wm,0.2)));
  const t=canvasTex(W,Math.min(Hh,1024),(g,w,h)=>{
    g.fillStyle=base;g.fillRect(0,0,w,h);
    g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=2;g.fillStyle='rgba(60,50,40,.55)';
    if(mode==='doors'){
      const n=Math.max(1,Math.round(wm/0.45));
      for(let i=1;i<n;i++){g.beginPath();g.moveTo(i*w/n,0);g.lineTo(i*w/n,h);g.stroke();}
      for(let i=0;i<n;i++){const x=(i+(i%2?0.12:0.88))*w/n;g.fillRect(x-1.5,h*0.42,3,h*0.12);} // 손잡이
      g.strokeRect(1,1,w-2,h-2);
    }else if(mode==='drawers'){
      const n=Math.max(2,Math.round(hm/0.22));
      for(let i=1;i<n;i++){g.beginPath();g.moveTo(0,i*h/n);g.lineTo(w,i*h/n);g.stroke();}
      for(let i=0;i<n;i++){g.fillRect(w*0.4,(i+0.5)*h/n-1.5,w*0.2,3);}
      g.strokeRect(1,1,w-2,h-2);
    }else if(mode==='fridge'){
      g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.stroke();g.beginPath();g.moveTo(0,h*0.42);g.lineTo(w,h*0.42);g.stroke();
      g.fillRect(w/2-6,h*0.2,3,h*0.18);g.fillRect(w/2+3,h*0.2,3,h*0.18);g.fillRect(w*0.2,h*0.45,w*0.2,3);g.fillRect(w*0.6,h*0.45,w*0.2,3);
    }else if(mode==='washer'){
      g.strokeStyle='rgba(40,40,40,.6)';g.lineWidth=5;g.beginPath();g.arc(w/2,h*0.55,w*0.3,0,7);g.stroke();
      g.fillStyle='rgba(60,70,80,.35)';g.beginPath();g.arc(w/2,h*0.55,w*0.24,0,7);g.fill();
      g.fillStyle='rgba(30,30,30,.5)';g.fillRect(w*0.1,h*0.06,w*0.8,h*0.08);
    }else if(mode==='ac'){
      g.fillStyle='rgba(30,30,30,.65)';g.fillRect(w*0.3,h*0.12,w*0.4,h*0.04);
      g.fillStyle='rgba(0,0,0,.08)';for(let i=0;i<14;i++)g.fillRect(w*0.15,h*(0.55+i*0.025),w*0.7,2);
    }
  });
  texCache[key]=t;return t;
}

let mode='orbit';
const orbit={target:new THREE.Vector3(),r:15,theta:0.6,phi:0.9};
const look={yaw:0,pitch:0};
function applyOrbit(){const {r,theta,phi}=orbit;camera.position.set(orbit.target.x+r*Math.sin(phi)*Math.sin(theta),orbit.target.y+r*Math.cos(phi),orbit.target.z+r*Math.sin(phi)*Math.cos(theta));camera.lookAt(orbit.target);}
function lookDir(){return new THREE.Vector3(-Math.sin(look.yaw)*Math.cos(look.pitch),Math.sin(look.pitch),-Math.cos(look.yaw)*Math.cos(look.pitch));}
function applyLook(){camera.lookAt(camera.position.clone().add(lookDir()));}
let tween=null;
function goView(v,instant){
  const eye=P(...v.eye),tgt=P(...v.tgt);
  const from={p:camera.position.clone(),t:camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(eye.distanceTo(tgt)))};
  const finish=()=>{
    mode=v.mode;camera.position.copy(eye);
    if(mode==='orbit'){orbit.target.copy(tgt);const o=eye.clone().sub(tgt);orbit.r=o.length();orbit.phi=Math.acos(o.y/orbit.r);orbit.theta=Math.atan2(o.x,o.z);applyOrbit();}
    else{const d=tgt.clone().sub(eye).normalize();look.pitch=Math.asin(d.y);look.yaw=Math.atan2(-d.x,-d.z);applyLook();}
    setCut(mode==='orbit'?+cutEl.value:2.3,true);
  };
  document.querySelectorAll('#views .btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===v.id)));
  document.getElementById('modeHint').textContent=v.mode==='orbit'
    ?'드래그로 돌려보고, 휠이나 두 손가락으로 확대하세요. 오른쪽 드래그(또는 Shift)로 이동해요.'
    :v.t+' 안이에요. 드래그로 둘러보고, 휠·핀치나 W/S 키로 앞뒤로 걸어요.';
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return;}
  if(v.mode==='look')setCut(2.3,true);
  tween={t0:performance.now(),dur:900,from,eye,tgt,finish};
}
function stepTween(now){
  if(!tween)return;const k=Math.min(1,(now-tween.t0)/tween.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  camera.position.lerpVectors(tween.from.p,tween.eye,e);
  camera.lookAt(new THREE.Vector3().lerpVectors(tween.from.t,tween.tgt,e));
  if(k>=1){const f=tween.finish;tween=null;f();}
}
// 포인터
const ptrs=new Map();let downAt=null,moved=0,lastPinch=null,lastMid=null;
canvas.addEventListener('contextmenu',e=>e.preventDefault());

canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||tween)return;
  const p=ptrs.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===1){
    if(mode==='orbit'){
      if(p.b===2||p.shift)pan(dx,dy);
      else{orbit.theta-=dx*0.006;orbit.phi=Math.min(1.45,Math.max(0.12,orbit.phi-dy*0.005));applyOrbit();}
    }else{look.yaw+=dx*0.0045;look.pitch=Math.min(1.2,Math.max(-1.2,look.pitch+dy*0.0045));applyLook();}
  }else if(ptrs.size===2){
    const [q1,q2]=[...ptrs.values()],dist=Math.hypot(q1.x-q2.x,q1.y-q2.y),mid={x:(q1.x+q2.x)/2,y:(q1.y+q2.y)/2};
    if(lastPinch){zoom((lastPinch-dist)*0.01);}
    if(lastMid&&mode==='orbit')pan(mid.x-lastMid.x,mid.y-lastMid.y);
    lastPinch=dist;lastMid=mid;
  }
});
function endPtr(e){
  if(ptrs.has(e.pointerId)&&ptrs.size===1&&moved<6&&downAt)pick(e.clientX,e.clientY);
  ptrs.delete(e.pointerId);lastPinch=null;lastMid=null;
}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);});
canvas.addEventListener('wheel',e=>{e.preventDefault();if(!tween)zoom(e.deltaY*0.0012);},{passive:false});
function zoom(k){
  if(mode==='orbit'){orbit.r=Math.min(32,Math.max(2.5,orbit.r*(1+k)));applyOrbit();}
  else walk(-k*1.6);
}
function walk(dist){const d=lookDir();d.y=0;d.normalize();camera.position.addScaledVector(d,dist);
  camera.position.x=Math.min(7.1,Math.max(0.1,camera.position.x));camera.position.z=Math.min(-0.1,Math.max(-11.2,camera.position.z));applyLook();}
function pan(dx,dy){
  const s=orbit.r*0.0016,right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),fwd=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),right);
  orbit.target.addScaledVector(right,-dx*s).addScaledVector(fwd,dy*s);applyOrbit();
}
const keys=new Set();

addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function stepKeys(dt){
  if(tween)return;const sp=1.6*dt;
  if(mode==='look'){
    if(keys.has('w')||keys.has('arrowup'))walk(sp);if(keys.has('s')||keys.has('arrowdown'))walk(-sp);
    if(keys.has('a')||keys.has('arrowleft')){look.yaw+=dt*1.4;applyLook();}if(keys.has('d')||keys.has('arrowright')){look.yaw-=dt*1.4;applyLook();}
  }else{
    if(keys.has('arrowleft')||keys.has('a')){orbit.theta+=dt;applyOrbit();}if(keys.has('arrowright')||keys.has('d')){orbit.theta-=dt;applyOrbit();}
  }
}

  const r=canvas.getBoundingClientRect();

  const hits=ray.intersectObjects(pickables,false).filter(h=>{const p=h.point;return p.y<=cutPlane.constant+0.001;});

  if(!hits.length){infoEl.hidden=true;return;}
  const info=hits[0].object.userData.info,[a,bb,z0,c,d,z1]=info.b;
  const box=new THREE.Box3(P(a,d,z0),P(c,bb,z1));sel=new THREE.Box3Helper(box,new THREE.Color('#D2873F'));scene.add(sel);
  document.getElementById('infoT').textContent=info.n;
  const mm=v=>Math.round(v*1000).toLocaleString();
  document.getElementById('infoD').innerHTML=`가로(동서) ${mm(c-a)} × 세로(남북) ${mm(d-bb)} × 높이 ${mm(z1-z0)} mm`+(z0>0.05?`<br>바닥에서 ${mm(z0)} mm 띄움`:'')+'<br>도면 기준 추정 치수';
  infoEl.hidden=false;
}
document.getElementById('infoX').onclick=()=>{infoEl.hidden=true;if(sel){scene.remove(sel);sel=null;}};

/* ---------- 이름표 ---------- */
const lblRoot=document.getElementById('labels');
DATA.labels.forEach(([t,x,y])=>labelDefs.push({t:t.replace('\n',' '),p:P(x,y,0.15),cls:t.includes('공사 없음')?'dim':'room',roomOnly:true}));
labelDefs.forEach(l=>{l.el=document.createElement('div');l.el.className='lb '+(l.cls||'');l.el.textContent=l.t;lblRoot.appendChild(l.el);});
let showLabels=true;const v3=new THREE.Vector3();
function updateLabels(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  labelDefs.forEach(l=>{
    let vis=showLabels&&!(l.roomOnly&&mode==='look')&&!(l.p.y>cutPlane.constant+0.1&&mode==='orbit');
    if(vis){v3.copy(l.p).project(camera);vis=v3.z<1&&v3.z>-1&&Math.abs(v3.x)<1.05&&Math.abs(v3.y)<1.05;
      if(mode==='look'&&vis){vis=camera.position.distanceTo(l.p)<6.5;}
      if(vis){l.el.style.left=((v3.x+1)/2*w)+'px';l.el.style.top=((1-v3.y)/2*h)+'px';}}
    l.el.hidden=!vis;
  });
}

/* ---------- UI ---------- */
const viewsEl=document.getElementById('views');
VIEWS.forEach(v=>{const b=document.createElement('button');b.className='btn';b.textContent=v.t;b.dataset.id=v.id;b.id='v-'+v.id;b.setAttribute('aria-pressed','false');b.onclick=()=>goView(v);viewsEl.appendChild(b);});
document.getElementById('dayBtn').onclick=()=>setNight(false);
document.getElementById('nightBtn').onclick=()=>setNight(true);
const FLOORS=[['#DDBA96','밝은 살색 (현재 계획)'],['#CFAE86','내추럴 오크'],['#C9BEAE','그레이지 오크'],['#9A7454','그랜드 로그 브라운 (처음 메모)']];
const fl=document.getElementById('floors');
FLOORS.forEach(([hx,t],i)=>{const b=document.createElement('button');b.className='sw';b.id='fl-'+i;b.setAttribute('aria-pressed',String(i===0));
  b.innerHTML=`<i style="background-color:${hx}"></i><span>${t}</span>`;
  b.onclick=()=>{floorHex=hx;const old=M.floor.map;M.floor.map=woodTex(hx);M.floor.needsUpdate=true;old.dispose();
    M.doorframe.color.set(shadeHex(hx,.92));fl.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};
  fl.appendChild(b);});
document.getElementById('lblChk').onchange=e=>{showLabels=e.target.checked;};
document.getElementById('mepChk').onchange=e=>{mep.visible=e.target.checked;};
const cutEl=document.getElementById('cut'),cutV=document.getElementById('cutV');
function setCut(v,silent){cutPlane.constant=v>=2.29?10:v;if(!silent||mode==='orbit')cutV.textContent=(+v).toFixed(2)+' m';}
cutEl.oninput=()=>{if(mode!=='orbit')goView(VIEWS[0]);setCut(+cutEl.value);};
const rail=document.getElementById('rail'),moreBtn=document.getElementById('moreBtn');
moreBtn.onclick=()=>{const c=rail.classList.toggle('closed');moreBtn.setAttribute('aria-expanded',String(!c));moreBtn.textContent=c?'옵션 더 보기':'옵션 접기';};
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.hidden=true;},7000);

/* ---------- 루프 ---------- */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?62:50;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
goView(VIEWS[0],true);setNight(false);
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  stepTween(now);stepKeys(dt);
  if(fanBlades)fanBlades.rotation.y+=dt*(night?2.2:1.2);
  renderer.render(scene,camera);updateLabels();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

</body>
</html>
